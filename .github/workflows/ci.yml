name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun install --frozen-lockfile
        working-directory: site
      # TypeDoc 0.28.20 needs minimatch 10, and the fix of this advisory is in minimatch 11 alone. The site's globs
      # are its own configuration. Remove the ignore once TypeDoc depends on a minimatch with the fix.
      - run: bun audit --ignore=GHSA-g3hv-75wg-m249
        working-directory: site
      # A warning is a doc comment to fix: the site must build without any.
      - run: bun run build 2>&1 | tee build.log && ! grep -q '\[warning\]' build.log
        working-directory: site

  # The package as a consumer outside Bun gets it (`smoke/smoke.ts`): the tarball installed with npm, run with Node
  # and typechecked under the oldest TypeScript the package supports and the current one, with the Effect of the
  # lockfile, which is the oldest its peer range accepts.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Node runs the consumer's TypeScript as it is, which needs Node 22.18 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run smoke
