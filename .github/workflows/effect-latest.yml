name: Effect latest

# The peer range (`~4.1.5`) accepts the later patches of the minor of the lockfile, and the library is developed, and
# what it rests on of Effect tested, at the version of the lockfile alone (`docs/premises.md`): what Effect does not
# document may change in a patch too. This runs the tests at the newest Effect the range accepts, so that a premise a
# new patch breaks is known the day after it is published, not at the next upgrade. A failure here is a lead for an
# upgrade (`.agents/skills/upgrade-effect/SKILL.md`), not a red commit.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

jobs:
  newest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # Node runs the tests' TypeScript as it is, which needs Node 22.18 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The newest version within the range of `package.json`, which is the peer range, and the same of
      # `@effect/platform-bun`, which the tools run on.
      - run: bun update effect @effect/platform-bun
      - run: bun pm ls | grep effect
      - run: bun run typecheck
      # A deprecation a new version adds shows here first.
      - run: bun run lint
      - run: bun run test
      - run: bun run test:node

  # What Effect has merged and not released: a patch of it reaches the range from the day it is published, and the
  # newest job above learns of it only then. Effect's own `snapshot.yml` publishes a build of each push to its `main`
  # to pkg.pr.new (one superseded by the next push is cancelled), and its releases are cut from that branch, so the
  # newest build that succeeded is what the next patch will hold. Its npm tags do not: `snapshot` stopped in 2024, and
  # `staging` holds a release for the minutes before it is `latest`. The build's version is still the last release, so
  # its commit names it. One issue for each build that fails, and none for one that passes.
  unreleased:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        run: |
          sha=$(gh run list --repo Effect-TS/effect --workflow snapshot.yml --branch main --event push \
            --status success --limit 1 --json headSha --jq '.[0].headSha')
          test -n "$sha"
          short=${sha::12}
          if [ -n "$(gh issue list --state all --search "\"Effect main at $short\" in:title" \
              --json title --jq ".[] | select(.title | startswith(\"Effect main at $short \")) | .title")" ]; then
            short=
          fi
          echo "sha=$short" >> "$GITHUB_OUTPUT"
      - if: steps.build.outputs.sha != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # Node runs the tests' TypeScript as it is, which needs Node 22.18 or newer.
      - if: steps.build.outputs.sha != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # The build of `@effect/platform-bun` asks for `effect` as a peer, which would be resolved from npm, as a second
      # copy beside the build: the override makes the build the only one. The install starts with no `node_modules`,
      # where the override is applied, and changes in the lockfile only the lines of Effect.
      - if: steps.build.outputs.sha != ''
        run: |
          node -e '
            const fs = require("fs")
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"))
            const at = (name) => `https://pkg.pr.new/Effect-TS/effect/${name}@${process.argv[1]}`
            p.devDependencies.effect = at("effect")
            p.devDependencies["@effect/platform-bun"] = at("@effect/platform-bun")
            p.overrides.effect = at("effect")
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")
          ' ${{ steps.build.outputs.sha }}
          bun install
          test "$(find node_modules -path '*node_modules/effect/package.json' | wc -l)" = 1
          bun pm ls | grep effect
      # The search runs once, a new seed each day, as its own daily job does at the lockfile. Its own timeout, short of
      # the job's, lets a search that hangs still reach the issue, as a failure.
      - id: checks
        if: steps.build.outputs.sha != ''
        continue-on-error: true
        timeout-minutes: 30
        run: |
          bun run typecheck
          bun run test
          bun run test:node
          bun run interleavings
      - if: steps.build.outputs.sha != '' && steps.checks.outcome != 'success'
        run: |
          sha=${{ steps.build.outputs.sha }}
          run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          gh issue create --title "Effect main at $sha fails the tests" --body "The typecheck, \`test\`, \
          \`test:node\` or \`interleavings\` fails at the build of Effect's \`main\` at \
          https://github.com/Effect-TS/effect/commit/$sha, which Effect has not released: a premise may fall in the \
          next patch (\`docs/premises.md\`), and the owner decides whether to tell Effect before it is released \
          (\`.agents/skills/upgrade-effect/SKILL.md\`). A search that fails prints its seed and path in the run. The \
          run: $run"
          exit 1

  # A minor of Effect after the one of the lockfile, which the peer range does not accept: its tests are a lead for an
  # upgrade, and an issue tells the owner of the result, green or red, since GitHub mails nobody when a scheduled run
  # passes. One issue per version, and none while the newest is in the range.
  next-minor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: newest
        run: |
          version=$(npm view effect versions --json | node -e '
            const range = require("./package.json").devDependencies.effect
            const [major, minor] = range.replace(/^[~^]/, "").split(".").map(Number)
            const stable = JSON.parse(require("fs").readFileSync(0, "utf8"))
              .filter((v) => /^\d+\.\d+\.\d+$/.test(v))
              .map((v) => v.split(".").map(Number))
              .filter(([a]) => a === major)
              .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2])
            const [, m] = stable.at(-1)
            if (m > minor) console.log(stable.at(-1).join("."))
          ')
          if [ -n "$version" ] && [ -n "$(gh issue list --state all --search "\"Effect $version\" in:title" \
              --json title --jq ".[] | select(.title | startswith(\"Effect $version \")) | .title")" ]; then
            version=
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.newest.outputs.version != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # Node runs the tests' TypeScript as it is, which needs Node 22.18 or newer.
      - if: steps.newest.outputs.version != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # The search draws a new seed on each run, so it runs ten times, once a version: what the newest minor changes in
      # the runtime of Effect may break a premise no one has named, which only an order of the fibers shows. Its own
      # timeout, short of the job's, lets a search that hangs still reach the issue, as a failure.
      - id: checks
        if: steps.newest.outputs.version != ''
        continue-on-error: true
        timeout-minutes: 45
        run: |
          bun install --frozen-lockfile
          version=${{ steps.newest.outputs.version }}
          bun add --dev "effect@$version" "@effect/platform-bun@$version"
          bun pm ls | grep effect
          bun run typecheck
          bun run lint
          bun run test
          bun run test:node
          for run in $(seq 10); do bun run interleavings; done
      - if: steps.newest.outputs.version != ''
        run: |
          version=${{ steps.newest.outputs.version }}
          run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          if [ "${{ steps.checks.outcome }}" = success ]; then
            title="Effect $version passes the tests"
            body="The typecheck, the lint, \`test\`, \`test:node\` and ten runs of \`interleavings\` pass at Effect \
          $version, outside the peer range: a lead for an upgrade (\`.agents/skills/upgrade-effect/SKILL.md\`). \
          The run: $run"
          else
            title="Effect $version fails the tests"
            body="The typecheck, the lint, \`test\`, \`test:node\` or one of ten runs of \`interleavings\` fails at \
          Effect \
          $version, outside the peer range: a premise may have fallen (\`docs/premises.md\`); a search that fails \
          prints its seed and path in the run. The run: $run"
          fi
          gh issue create --title "$title" --body "$body"
