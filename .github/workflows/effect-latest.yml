name: Effect latest

# The peer range (`~4.1.4`) accepts the later patches of the minor of the lockfile, and the library is developed, and
# what it rests on of Effect tested, at the version of the lockfile alone (`docs/premises.md`): what Effect does not
# document may change in a patch too. This runs the tests at the newest Effect the range accepts, so that a premise a
# new patch breaks is known the day after it is published, not at the next upgrade. A failure here is a lead for an
# upgrade (`.agents/skills/upgrade-effect/SKILL.md`), not a red commit.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

jobs:
  newest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # Node runs the tests' TypeScript as it is, which needs Node 22.18 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The newest version within the range of `package.json`, which is the peer range, and the same of
      # `@effect/platform-bun`, which the tools run on.
      - run: bun update effect @effect/platform-bun
      - run: bun pm ls | grep effect
      - run: bun run typecheck
      # A deprecation a new version adds shows here first.
      - run: bun run lint
      - run: bun run test
      - run: bun run test:node

  # A minor of Effect after the one of the lockfile, which the peer range does not accept: its tests are a lead for an
  # upgrade, and an issue tells the owner of the result, green or red, since GitHub mails nobody when a scheduled run
  # passes. One issue per version, and none while the newest is in the range.
  next-minor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: newest
        run: |
          version=$(npm view effect versions --json | node -e '
            const range = require("./package.json").devDependencies.effect
            const [major, minor] = range.replace(/^[~^]/, "").split(".").map(Number)
            const stable = JSON.parse(require("fs").readFileSync(0, "utf8"))
              .filter((v) => /^\d+\.\d+\.\d+$/.test(v))
              .map((v) => v.split(".").map(Number))
              .filter(([a]) => a === major)
              .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2])
            const [, m] = stable.at(-1)
            if (m > minor) console.log(stable.at(-1).join("."))
          ')
          if [ -n "$version" ] && [ -n "$(gh issue list --state all --search "\"Effect $version\" in:title" \
              --json title --jq ".[] | select(.title | startswith(\"Effect $version \")) | .title")" ]; then
            version=
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.newest.outputs.version != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # Node runs the tests' TypeScript as it is, which needs Node 22.18 or newer.
      - if: steps.newest.outputs.version != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # The search draws a new seed on each run, so it runs ten times, once a version: what the newest minor changes in
      # the runtime of Effect may break a premise no one has named, which only an order of the fibers shows. Its own
      # timeout, short of the job's, lets a search that hangs still reach the issue, as a failure.
      - id: checks
        if: steps.newest.outputs.version != ''
        continue-on-error: true
        timeout-minutes: 45
        run: |
          bun install --frozen-lockfile
          version=${{ steps.newest.outputs.version }}
          bun add --dev "effect@$version" "@effect/platform-bun@$version"
          bun pm ls | grep effect
          bun run typecheck
          bun run lint
          bun run test
          bun run test:node
          for run in $(seq 10); do bun run interleavings; done
      - if: steps.newest.outputs.version != ''
        run: |
          version=${{ steps.newest.outputs.version }}
          run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          if [ "${{ steps.checks.outcome }}" = success ]; then
            title="Effect $version passes the tests"
            body="The typecheck, the lint, \`test\`, \`test:node\` and ten runs of \`interleavings\` pass at Effect \
          $version, outside the peer range: a lead for an upgrade (\`.agents/skills/upgrade-effect/SKILL.md\`). \
          The run: $run"
          else
            title="Effect $version fails the tests"
            body="The typecheck, the lint, \`test\`, \`test:node\` or one of ten runs of \`interleavings\` fails at \
          Effect \
          $version, outside the peer range: a premise may have fallen (\`docs/premises.md\`); a search that fails \
          prints its seed and path in the run. The run: $run"
          fi
          gh issue create --title "$title" --body "$body"
