name: Interleavings

# `src/interleaving.test.ts` searches random histories for an order that breaks a guarantee, from a seed fast-check
# draws at random on each run, so it is kept out of `bun run test`: a failure here is a finding to reproduce with the
# seed and the path it prints (ROADMAP.md), not a red commit.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run interleavings
